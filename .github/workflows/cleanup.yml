name: Cleanup Old Packages

# GHCR retention for the packages this repository publishes.
#
# Why a cleanup action rather than "delete all untagged versions":
# Images are built with docker/build-push-action and buildx, which attaches an SLSA
# provenance attestation by default. The pushed artifact is therefore an OCI *index*
# (which carries the tag) plus *untagged* child manifests (the platform manifest and the
# attestation). Deleting "all untagged versions" removes the platform manifest of the
# current `latest`: the tag still resolves, the index is still there, and `docker pull`
# fails with "manifest unknown". dataaxiom/ghcr-cleanup-action resolves child manifests
# before applying the rules, so children of kept images stay and children of deleted
# parents go with them.
#
# The images are attested with actions/attest-build-provenance and subject-name, which
# creates sha256-<digest> referrer tags. delete-orphaned-images removes those once the parent
# digest is gone.
#
# A package that does not exist (not published yet, or deleted) is skipped with a warning
# instead of failing the run: the action aborts on the first package it cannot find.
#
# keep-n-tagged 15 leaves rollback room across the 15 newest commit builds per package.

on:
  schedule:
    - cron: '0 2 * * 0'   # Sundays 02:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only log, delete nothing'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  # GHCR package names without the owner prefix; nested names are fine. Every package a
  # workflow publishes belongs here, or it grows without limit.
  PACKAGES: straightmail,straightmail/backend,straightmail/aio
  # Number of newest tagged images to keep. Never set this to 0 — the action reads 0 as
  # "delete every tagged image", which would empty the package.
  KEEP_TAGGED: '15'
  # Release tags, which retention never deletes. `latest` and `edge` are protected
  # unconditionally below. This is a regular expression (the action runs with
  # use-regex): the wildcard syntax has no character classes, so `[0-9]` would only match itself.
  # Alternatives: the released tags by name, then any x, x.y and x.y.z (optionally with a
  # `v` prefix). A bare major is limited to three digits so that a 7-character commit SHA
  # tag made of digits only stays under retention.
  RELEASE_TAGS: '0\.4\.0|0\.4\.1|0\.4|0|v?[0-9]{1,3}|v?[0-9]+\.[0-9]+|v?[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  images:
    name: Images — straightmail, straightmail/backend, straightmail/aio
    runs-on: ubuntu-latest
    steps:
      - name: Compose guarded action inputs
        id: guard
        env:
          IN_KEEP: ${{ env.KEEP_TAGGED }}
          IN_RELEASE_TAGS: ${{ env.RELEASE_TAGS }}
        run: |
          set -euo pipefail

          # Invariant 1 — keep-n-tagged is never 0 and never non-numeric.
          KEEP="${IN_KEEP:-10}"
          case "$KEEP" in ''|*[!0-9]*) KEEP=10 ;; esac
          if [ "$KEEP" -lt 1 ]; then KEEP=1; fi
          echo "keep=$KEEP" >> "$GITHUB_OUTPUT"

          # Invariant 2 — latest and edge are always protected.
          # latest: the newest release, what a deployment resolves to a digest.
          # edge: the newest default-branch build.
          # The action matches a regular expression anywhere in a tag or digest, so the
          # alternatives are anchored to the whole tag.
          EXCLUDE="latest|edge"
          if [ -n "${IN_RELEASE_TAGS}" ]; then
            EXCLUDE="${EXCLUDE}|${IN_RELEASE_TAGS}"
          fi
          EXCLUDE="^(${EXCLUDE})\$"

          echo "exclude=$EXCLUDE" >> "$GITHUB_OUTPUT"
          echo "Effective exclude-tags: $EXCLUDE"
          echo "Effective keep-n-tagged: $KEEP"

      - name: Select the packages that exist
        id: packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_type=$(gh api "/users/$OWNER" --jq .type)
          case "$owner_type" in
            Organization) scope=orgs ;;
            *) scope=users ;;
          esac
          existing=""
          IFS=',' read -ra wanted <<< "$PACKAGES"
          for package in "${wanted[@]}"; do
            if error=$(gh api "/$scope/$OWNER/packages/container/${package//\//%2F}" --silent 2>&1); then
              existing="${existing:+$existing,}$package"
            elif [[ "$error" == *"HTTP 404"* ]]; then
              echo "::warning::Package $package does not exist under $OWNER or this repository has no access to it; skipped"
            else
              echo "::error::Looking up package $package failed: $error"
              exit 1
            fi
          done
          echo "list=$existing" >> "$GITHUB_OUTPUT"
          echo "Packages to clean up: ${existing:-none}"

      # Keep the newest tagged images and clear untagged leftovers. No older-than here,
      # so keep-n-tagged counts across all images rather than only the older ones.
      - name: Retention — keep newest tagged, drop untagged leftovers
        if: steps.packages.outputs.list != ''
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ steps.packages.outputs.list }}
          keep-n-tagged: ${{ steps.guard.outputs.keep }}
          exclude-tags: ${{ steps.guard.outputs.exclude }}
          use-regex: true
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true
          # ROLLOUT GATE: the "github.event_name == 'schedule' ||" part keeps the SCHEDULED
          # run in dry-run mode. Remove it (leaving "inputs.dry-run || false") only once a
          # manual dry-run has been reviewed for this repository.
          dry-run: ${{ github.event_name == 'schedule' || inputs.dry-run }}
          log-level: info
