name: Monorepo Full Build

on:
  push:
    branches: [ "master", "main" ]

# One publish at a time for ghcr.io/<repo>/monorepo, so a fast follow-up push cannot overtake
# the run before it and leave an older image behind :latest.
concurrency:
  group: monorepo-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build & Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js (for Angular build)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Full build (backend + Angular frontend)
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test
        env:
          SKIP_FRONTEND_BUILD: "true"

      - name: Upload combined JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-jar
          path: backend/build/libs/*.jar
          retention-days: 7

  frontend:
    name: Client Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --no-watch

  docker-combined:
    name: Build & Push Combined Image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download combined JAR
        uses: actions/download-artifact@v4
        with:
          name: combined-jar
          path: backend/build/libs/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: echo "repo_lowercase=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # /monorepo, nicht /backend: hier wird das KOMBINIERTE Artefakt gepusht,
          # Spring Boot samt Angular (siehe Job "Backend Build & Test", der das
          # combined-jar hochlaedt, und den Download weiter oben). Der Pfad hiess bis
          # 2026-09-17 /backend und beschrieb damit den Quellordner statt des Inhalts —
          # das hat beim Umstellen des Clusters fuer echte Verwirrung gesorgt.
          # Backend-only liegt weiterhin in /backend (backend.yml) und im Root-Pfad
          # (release.yml mit SKIP_FRONTEND_BUILD).
          images: ghcr.io/${{ steps.repo.outputs.repo_lowercase }}/monorepo
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          provenance: true
          sbom: true
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Eigener Cache-Tag. Vorher teilte sich dieser Lauf den buildcache mit
          # backend.yml, obwohl beide unterschiedliche Artefakte bauen.
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.repo_lowercase }}/monorepo:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.repo_lowercase }}/monorepo:buildcache,mode=max

      - name: Scan image for known vulnerabilities
        # 0.28.0 aufloest GitHub nicht mehr, das Tag existiert nicht mehr im Action-Repo.
        # Der Release-Lauf vom 2026-09-17 starb daran schon in "Set up job", also bevor
        # ein einziger Schritt lief: Actions werden vor dem ersten Schritt aufgeloest.
        # v0.36.0 kennt alle fuenf hier benutzten Eingaben unveraendert.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.repo_lowercase }}/monorepo@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: container-image

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.repo_lowercase }}/monorepo
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
