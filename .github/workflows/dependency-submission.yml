# Submits the resolved Gradle dependency graph to GitHub, so Dependabot alerts see transitive
# dependencies. spring-security-core, for one, comes through the Boot starters and stands in no
# build file; read statically, a CVE in such a jar raises no alert. cm-k8s-cluster spec 011, ISC-162.
name: Dependency submission

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: backend
