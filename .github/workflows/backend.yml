name: Backend CI

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  # Called by ci.yml, whose `CI gate` job reports the combined result, and by images.yml as
  # the test gate before an image is published.
  workflow_call:
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

# Build and test only; this workflow publishes nothing. Images come from images.yml.

jobs:
  build:
    name: Build JAR
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle (skip frontend)
        run: ./gradlew build -x test
        env:
          SKIP_FRONTEND_BUILD: "true"

  test:
    name: Run Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test
        env:
          SKIP_FRONTEND_BUILD: "true"

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/
          retention-days: 3
