version: 2

# Only GitHub Actions stay with Dependabot. Gradle and npm moved to the Renovate operator in
# cm-k8s-cluster (spec 011, 2026-11-23), which also brings Spring Boot patches as their own PR and
# security fixes outside any schedule; two bots on the same dependency would open duplicate PRs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
